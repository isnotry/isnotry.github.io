# =========================================================
# isnotry.github.io — Jekyll 配置（GitHub Pages 兼容）
# =========================================================

title: "kingsir's Work"
tagline: 不写代码，用 AI 造东西
description: kingsir 的个人站点 —— 不写代码的 Vibe Coding 玩家，把想法讲清楚，剩下的交给 AI。收录开源项目、工具与折腾记录。
keywords: kingsir, Vibe Coding, AI 编程, 独立开发, 开源项目, Jekyll, GitHub Pages
author: kingsir
github_username: isnotry
email: hi@kingsir.work
og_image: /assets/img/og-cover.png
# twitter_username: isnotry    # 有了就填上，Twitter/X 分享卡会带站点账号

# 部署到 GitHub Pages 时：
#   - 仓库名为 isnotry.github.io  -> baseurl 留空
#   - 仓库名为 blog(或其他)        -> baseurl 填 /blog
baseurl: ""
url: "https://kingsir.work"        # 站点绝对地址（RSS / 绝对链接用）

# 构建
markdown: kramdown
highlighter: rouge
permalink: /post/:title/           # 文章 URL：/post/1/
exclude:
  - tools/                       # 本地预览生成器，不进站点
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - node_modules/
  - posts/                      # 旧的纯静态文章目录，已迁到 _posts

# 插件（GitHub Pages 白名单内）
plugins:
  - jekyll-feed

# 文章默认布局
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: "post"
