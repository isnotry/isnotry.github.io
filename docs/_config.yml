# =========================================================
# isnotry.github.io — Jekyll 配置（GitHub Pages 兼容）
# =========================================================

title: "kingsir's Work"
tagline: 不写代码，用 AI 造东西
description: kingsir 的个人站点 —— 不写代码的 Vibe Coding 玩家，把想法讲清楚，剩下的交给 AI。收录开源项目、工具与折腾记录。
keywords: kingsir, Vibe Coding, AI 编程, 独立开发, 开源项目, Jekyll, GitHub Pages
author: kingsir
github_username: isnotry
email: hi@kingsir.work
og_image: /assets/img/og-cover.png
# twitter_username: isnotry    # 有了就填上，Twitter/X 分享卡会带站点账号

# 部署到 GitHub Pages 时：
#   - 仓库名为 isnotry.github.io  -> baseurl 留空
#   - 仓库名为 blog(或其他)        -> baseurl 填 /blog
baseurl: ""
url: "https://kingsir.work"        # 站点绝对地址（RSS / 绝对链接用）

# 构建
markdown: kramdown
highlighter: rouge

# ⚠️ 时区必须显式写死，别依赖构建机
# GitHub Pages 的构建机跑在 UTC。front matter 里写 `date: 2026-10-27`（只有日期没有时间）
# 会被按「构建机本地时区」解释成 2026-10-27T00:00:00Z —— 而北京时间此刻可能才 10-27 00:37，
# UTC 还停在 10-26 16:37，于是这篇文章「发布日期在未来」被 Jekyll 静默丢弃：
# 首页不出现、/posts/N/ 直接 404、sitemap 里也没有，但 Actions 显示构建成功。
# 本地预览器不判断 future，所以本地一切正常 —— 典型的「本地好的，线上没有」。
timezone: Asia/Shanghai

# 允许发布「日期在未来」的文章：本地写完当天就发，不再因为构建机时钟差几小时而消失。
# （代价是不能靠 front matter 排期定时发布 —— 这个站用不到）
future: true
permalink: /posts/:title/          # 文章 URL：/posts/1/
exclude:
  - tools/                       # 本地预览生成器，不进站点
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - node_modules/
  - posts/                      # 旧的纯静态文章目录，已迁到 _posts

# 插件（GitHub Pages 白名单内）
plugins:
  - jekyll-feed

# 文章默认布局
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: "post"
