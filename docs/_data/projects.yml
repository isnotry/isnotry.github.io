# 我的项目（手写维护，对应 https://github.com/isnotry 的仓库）
# lang_class 映射到 style.css 里的 .lang-* 圆点颜色
# stars 留空则不显示星标（避免 0 star 的噪声）
# demo 留空则不显示「在线试用」入口（例如需要自建服务或本地安装的项目）
# date 用于排序：首页按 date 从新到旧渲染（见 index.html）
#   取仓库创建时间（已换算为北京时间），写成带引号的 ISO 串且带时分
#   同天项目若不带时分，sort + reverse 后相对顺序会翻转
# updated 用于 sitemap.xml 的 <lastmod>，取仓库最后推送时间（北京时区）。
#   新提交了代码就顺手改这一行；不改也不影响渲染，只是 lastmod 会偏旧
# demo 统一用自定义域 https://kingsir.work/<Repo>/：
#   站点挂上自定义域后，isnotry.github.io/<Repo>/ 会自动 301 到这个地址
# shot / shot_alt：项目卡（1200×630 暖调宽卡），显示在 /projects 页的列表里。
#   母版由 tools/make-project-cards.py 生成到 writing/images/product-cover/
#   product-cover-<仓库名小写>.webp，再转 WebP 上传图床：
#     cd tools/imgbed && IMGBED_PASSWORD=xxx MODE=product node tools/upload-covers.mjs
#   shot 填图床地址 https://img.kingsir.work/i/<日期>/project-<仓库名小写>.webp。
#   ⚠️ 上传名必须带 project- 前缀：图床是扁平 key 空间，minitools / splitledger /
#   tasktoagent / ankimaker / d2 文章和项目重名，不前缀会互相覆盖。
#   ⚠️ 站点 assets/img/projects/ 已于 2026-10-19 清空，图不跟仓库推。
#   配色遵循 writing/images/product-cover/design.md（不是 post-cover 那份）。
#   改了项目定位/语言标签就重跑一次脚本 + 重新上传。
