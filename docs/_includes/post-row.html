<article class="post-item reveal">
  <a class="thumb {{ include.post.cover }}" href="{{ include.post.url }}" aria-label="{{ include.post.title }}">
    <span class="cover-emoji">{{ include.post.emoji }}</span>
  </a>
  <div class="body">
    <div class="meta"><span class="cat">{{ include.post.category }}</span><span class="date">{{ include.post.date | date: "%Y-%m-%d" }}</span></div>
    <h2><a href="{{ include.post.url }}">{{ include.post.title }}</a></h2>
    <p class="excerpt">{{ include.post.excerpt }}</p>
    {% if include.post.tags %}
    <div class="tags">
      {% for t in include.post.tags %}<span class="tag">{{ t }}</span>{% endfor %}
    </div>
    {% endif %}
  </div>
</article>
